<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal / Shield Tech Base -->
    <path d="M50 5 L88 27 L88 73 L50 95 L12 73 L12 27 Z" fill="#101F42" stroke="url(#cyanGrad)" stroke-width="3.5" filter="url(#glow)"/>
    
    <!-- Tech Nodes & Circuit Lines -->
    <path d="M28 35 L40 45 L50 35 L60 45 L72 35" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="28" cy="35" r="3" fill="#00F0FF"/>
    <circle cx="50" cy="35" r="3.5" fill="#00F0FF"/>
    <circle cx="72" cy="35" r="3" fill="#00F0FF"/>

    <!-- Graduation Cap / Growth Chevron -->
    <polygon points="50,22 78,38 50,54 22,38" fill="url(#cyanGrad)"/>
    <polygon points="42,50 42,66 58,66 58,50 50,55" fill="#38BDF8"/>
    
    <!-- Code Brackets { / } Base -->
    <path d="M36 68 L26 76 L36 84" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 68 L74 76 L64 84" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="46" y1="84" x2="54" y2="68" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="125" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Endow<tspan fill="url(#cyanGrad)">IT</tspan></text>
  <text x="128" y="92" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#38BDF8" letter-spacing="6">ACADEMY</text>
  <circle cx="230" cy="88" r="2.5" fill="#00F0FF"/>
  <text x="240" y="92" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8" letter-spacing="1.5">CAREER TRANSFORMATION</text>
</svg>
